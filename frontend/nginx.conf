# 앞단(Dokploy의 프록시)이 보낸 X-Forwarded-Proto(https)를 그대로 백엔드에 넘긴다. 없으면 이 서버가 본 값을 쓴다
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 파일 첨부(추출 API) 업로드를 막지 않도록 여유 있게 둔다
    client_max_body_size 20m;

    # /api/* 는 compose의 api 서비스(Spring Boot :8000)로 그대로 전달한다
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # AI 호출이 있는 요청은 오래 걸릴 수 있다
        proxy_read_timeout 120s;
    }

    # API 문서(Swagger UI와 OpenAPI JSON)도 백엔드(springdoc)로 전달한다
    location /swagger-ui {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /v3/api-docs {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # 그 밖의 경로는 SPA의 index.html로 보낸다 (새로고침해도 화면이 뜨도록)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
