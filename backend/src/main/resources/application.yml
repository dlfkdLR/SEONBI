server:
  port: 8000
  forward-headers-strategy: framework # 프록시 뒤에서 https 주소로 리다이렉트·문서 주소를 만들도록
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/seonbi}
    username: ${SPRING_DATASOURCE_USERNAME:seonbi}
    password: ${SPRING_DATASOURCE_PASSWORD:seonbi}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui
    doc-expansion: none # 처음에는 태그만 보이고 눌러서 펼친다
    display-request-duration: true
    default-models-expand-depth: 0
