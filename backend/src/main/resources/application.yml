server:
  port: 8000
  forward-headers-strategy: framework # 프록시 뒤에서 https 주소로 리다이렉트·문서 주소를 만들도록
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/seonbi}
    username: ${SPRING_DATASOURCE_USERNAME:seonbi}
    password: ${SPRING_DATASOURCE_PASSWORD:seonbi}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway(db/migration)만 바꾼다. Hibernate는 Entity와 실제 테이블이 맞는지 시작할 때 검증만 한다
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 기존 DB는 기본적으로 시작을 막는다. 검토한 운영 DB를 처음 이관할 때만 환경변수로 한 번 켠다.
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
    validate-on-migrate: true # 적용한 마이그레이션 파일이 바뀌었으면(체크섬 불일치) 시작하지 않는다
    out-of-order: false
    clean-disabled: true # flyway clean(모든 객체 삭제)은 쓸 수 없게 막는다
springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui
    doc-expansion: none # 처음에는 태그만 보이고 눌러서 펼친다
    display-request-duration: true
    default-models-expand-depth: 0
